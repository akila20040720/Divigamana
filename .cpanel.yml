---
# cPanel Git Version Control deployment configuration.
# DEPLOYPATH must be the document root for this domain.
# Create .env manually on the server with restrictive permissions. It is intentionally
# not copied from Git and must never contain a browser-visible key.
deployment:
  tasks:
    - export DEPLOYPATH=/home/rakiyacl/divigamana.lk
    - /bin/mkdir -p "$DEPLOYPATH/public" "$DEPLOYPATH/app" "$DEPLOYPATH/config" "$DEPLOYPATH/admin" "$DEPLOYPATH/database" "$DEPLOYPATH/scripts"
    - /bin/cp index.php terms.php privacy.php api.php robots.txt sitemap.xml .htaccess "$DEPLOYPATH/"
    - /bin/cp database/schema.sql database/seed.sql "$DEPLOYPATH/database/"
    - /bin/cp scripts/migrate-dashboard.php "$DEPLOYPATH/scripts/"
    - /bin/cp admin/index.php "$DEPLOYPATH/admin/"
    - /bin/cp -R app/* "$DEPLOYPATH/app/"
    - /bin/cp config/local.php "$DEPLOYPATH/config/"
    - /bin/cp -R public/assets "$DEPLOYPATH/public/"
